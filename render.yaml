services:
  - type: web
    name: fibereye-connect
    env: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: COOKIE_SECURE
        value: "true"
      - key: NODE_VERSION
        value: 22.12.0
      - key: DATA_DIR
        value: /tmp/fibereye-data
      - key: ADMIN_PASSWORD
        sync: false
