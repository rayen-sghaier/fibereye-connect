services:
  - type: web
    name: fibereye-connect
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: COOKIE_SECURE
        value: "true"
      - key: NODE_VERSION
        value: 22.12.0
      - key: DATA_DIR
        value: /tmp/fibereye-data
      - key: ADMIN_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STATE_TABLE
        value: fibereye_state
      - key: SUPABASE_STATE_ID
        value: main
      - key: SUPABASE_BUCKET
        value: fibereye-products
